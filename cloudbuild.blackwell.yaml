# The premium (RTX PRO 6000 Blackwell) synthesis worker image
# (Dockerfile.blackwell). The first step bakes the enabled voicebanks into
# baked_voicebanks/, which the Dockerfile copies to /app/voicebanks. Build with
# scripts/build_synthesis_worker_blackwell_prod.sh.
steps:
  # The Cloud SDK image has no python3 on its PATH (since SDK 594): use the Python that gcloud
  # itself runs on. ($$ is a literal $ in Cloud Build; ${_VOICEBANK_BUCKET} is the substitution.)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        PY="$$(command -v python3 || echo /usr/lib/google-cloud-sdk/platform/bundledpythonunix/bin/python3)"
        exec "$$PY" scripts/bake_voicebanks.py --manifest env/voicebank_manifest.prod.json \
          --bucket "${_VOICEBANK_BUCKET}" --out baked_voicebanks
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.blackwell
      - -t
      - ${_BLACKWELL_IMAGE}
      - .

images:
  - ${_BLACKWELL_IMAGE}

timeout: 3600s
